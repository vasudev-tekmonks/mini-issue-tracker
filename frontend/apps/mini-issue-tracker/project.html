<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="pragma" content="no-cache" />
        <meta http-equiv="expires" content="-1" />

        <link rel="stylesheet" type="text/css" href="./css/common.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />

        <script type="module">
            import { project } from "./js/project.mjs";

            window.project = project;
            project.init();
        </script>

        <title>Project - Mini Issue Tracker</title>
    </head>

    <body>
        <main class="main-container">
            <div class="panel">
                <div class="panel-header">
                    <div>
                        <button
                            class="secondary-button"
                            onclick="project.goBack()"
                        >
                            ← Back
                        </button>

                        <h2 id="project-name">Project</h2>
                        <p id="project-description"></p>
                    </div>

                    <button
                        class="primary-button"
                        onclick="project.openIssueForm()"
                    >
                        + New Issue
                    </button>
                </div>

                <form
                    id="issue-form"
                    class="project-form"
                    hidden
                    onsubmit="
                        event.preventDefault();
                        project.createIssue();
                    "
                >
                    <div class="form-fields">
                        <h3 id="issue-form-title">Create Issue</h3>

                        <input
                            id="issue-title"
                            type="text"
                            placeholder="Issue title"
                            maxlength="150"
                            required
                        />

                        <textarea
                            id="issue-description"
                            placeholder="Description (optional)"
                            maxlength="1000"
                        ></textarea>

                        <input
                            id="issue-assignee"
                            type="text"
                            placeholder="Assignee (optional)"
                        />

                        <select id="issue-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>

                        <select id="issue-status">
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button
                            type="button"
                            class="secondary-button"
                            onclick="project.closeIssueForm()"
                        >
                            Cancel
                        </button>

                        <button type="submit" class="primary-button">
                            Create Issue
                        </button>
                    </div>
                </form>

                <div id="project-issues" class="issues-list">
                    <div class="empty-state">
                        <h3>Loading issues...</h3>
                        <p>Fetching project issues.</p>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
